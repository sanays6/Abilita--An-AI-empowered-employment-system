{% extends 'base.html' %}
{% block content %}
<div class="row min-vh-100 align-items-center fade-in pb-5">
    <div class="col-md-5 mx-auto">
        <div class="text-center mb-4">
            <div class="display-4 text-info mb-3"><i class="bi bi-person-fill-add"></i></div>
            <h2 class="fw-bold">Provision Expert</h2>
            <p class="text-muted">Register a new Domain Expert securely</p>
        </div>
        
        <div class="card premium-card border-0 shadow-lg p-sm-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Full Display Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" name="name" class="form-control border-start-0 ps-0 text-bg-light custom-input" placeholder="Expert Name" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0 text-bg-light custom-input" placeholder="expert@domain.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Authorized Domain Focus</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-diagram-3"></i></span>
                            <input type="text" name="domain" class="form-control border-start-0 ps-0 text-bg-light custom-input" placeholder="e.g. Data Science" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Initial Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0 text-bg-light custom-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-info btn-lg w-100 fw-bold rounded-pill shadow-sm text-dark">Propagate Details</button>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'admin_list_experts' %}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> Discard and Return</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.custom-input { background-color: #f8f9fa !important; box-shadow: none !important; }
.custom-input:focus { background-color: #fff !important; }
.input-group:focus-within .input-group-text { background-color: #fff !important; border-color: #0dcaf0; color: #0dcaf0 !important; }
.input-group:focus-within .custom-input { border-color: #0dcaf0; }
</style>
{% endblock %}
