{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 fade-in">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <span class="badge bg-danger text-light mb-2 px-3 py-2 rounded-pill fw-bold border border-danger"><i class="bi bi-shield-lock-fill me-1"></i> System Root Access</span>
            <h2 class="fw-bold mb-0">Administration Console</h2>
            <p class="text-muted">High-level management of entities and AI parameters.</p>
        </div>
    </div>

    <!-- Quick Actions Row -->
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <a href="{% url 'admin_list_users' %}" class="text-decoration-none">
                <div class="card premium-card border-0 shadow-sm h-100 text-center py-4 bg-primary text-white">
                    <i class="bi bi-people display-4 mb-2"></i>
                    <h5 class="fw-bold">User Database</h5>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="{% url 'admin_list_experts' %}" class="text-decoration-none">
                <div class="card premium-card border-0 shadow-sm h-100 text-center py-4 bg-info text-dark">
                    <i class="bi bi-person-badge display-4 mb-2"></i>
                    <h5 class="fw-bold">Expert Roster</h5>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="{% url 'admin_ai_settings' %}" class="text-decoration-none">
                <div class="card premium-card border-0 shadow-sm h-100 text-center py-4 bg-warning text-dark">
                    <i class="bi bi-cpu display-4 mb-2"></i>
                    <h5 class="fw-bold">AI Base Config</h5>
                </div>
            </a>
        </div>

    </div>
</div>
{% endblock %}
