{% extends 'base.html' %}
{% block content %}
<div class="row min-vh-100 align-items-center fade-in pb-5">
    <div class="col-md-5 mx-auto">
        <div class="text-center mb-4">
            <div class="display-4 text-warning mb-3"><i class="bi bi-briefcase-fill"></i></div>
            <h2 class="fw-bold">Expert Portal</h2>
            <p class="text-muted">Domain experts access only</p>
        </div>
        
        <div class="card premium-card border-0 shadow-lg p-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0 text-bg-light custom-input" placeholder="expert@domain.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0 text-bg-light custom-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold rounded-pill shadow-sm mb-3 text-dark">Access Portal</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.custom-input { background-color: #f8f9fa !important; box-shadow: none !important; }
.custom-input:focus { background-color: #fff !important; }
.input-group:focus-within .input-group-text { background-color: #fff !important; border-color: #ffc107; color: #ffc107 !important; }
.input-group:focus-within .custom-input { border-color: #ffc107; }
</style>
{% endblock %}
